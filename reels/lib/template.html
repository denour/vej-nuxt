<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1080, height=1920">
<title>VEJ reel · {{SLUG}}</title>
<style>
{{FONTS}}
  body { margin: 0; }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #cv { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  .layer { position: absolute; inset: 0; }
  .rv { display: inline-block; will-change: opacity, transform; }

  /* ---- firma: título de apertura ---- */
  #title .wrap { position: absolute; left: 92px; right: 92px; top: 262px; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
  /* placa de papel crema detrás del título (title.plate) para fondos claros o con mucho detalle */
  #title .plate { position: absolute; left: 60px; top: 226px; width: {{PLATE_W}}px; height: {{PLATE_H}}px; border-radius: 20px; background: rgba(245,239,228,0.93); box-shadow: 0 14px 34px rgba(10,31,28,0.22); opacity: 0; }
  .eyebrow { display: flex; align-items: center; gap: 18px; font-family: Inter, sans-serif; font-weight: 700; font-size: 25px; letter-spacing: 0.3em; text-transform: uppercase; color: {{EYEBROW_COLOR}}; }
  .eyebrow i { display: block; width: 46px; height: 3px; background: #D2725A; }
  h1 { margin: 0; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 480; font-size: {{TITLE_SIZE}}px; line-height: 1.0; letter-spacing: -0.03em; color: {{TITLE_COLOR}}; text-wrap: balance; }
  h1 .rv { padding-bottom: 4px; margin-right: 0.22em; }
  h1 .kw { color: #D2725A; font-weight: 560; }

  /* ---- rótulos de la escena (los crea scene.js con api.label) ---- */
  .annot { position: absolute; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 420; font-size: 42px; line-height: 1.12; color: #14302A; }
  .annot.light { color: #F5EFE4; text-shadow: 0 1px 4px rgba(10,31,28,0.6); }
  .annot.big { font-size: 128px; font-weight: 520; line-height: 1; color: #D2725A; letter-spacing: -0.03em; }
  .annot.num { font-size: 220px; font-weight: 560; line-height: 0.9; color: #D2725A; letter-spacing: -0.04em; }
  .annot.tag { font-family: Inter, sans-serif; font-style: normal; font-weight: 700; font-size: 22px; letter-spacing: 0.24em; text-transform: uppercase; color: #2D4A3F; }
  .annot.tag.light { color: #E8E1D3; }
  .annot.stamp { font-family: Inter, sans-serif; font-style: normal; font-weight: 700; font-size: 30px; letter-spacing: 0.18em; text-transform: uppercase; color: #F5EFE4; background: #D2725A; padding: 10px 22px 8px; border-radius: 8px; }
  .annot.stamp.ok { background: #2D4A3F; }

  /* ---- firma: subtítulos en cápsula (borde inferior a 262 px del fondo: zona segura de Reels) ---- */
  .sub-band { position: absolute; left: 60px; right: 60px; bottom: 262px; display: flex; align-items: flex-end; justify-content: center; }
  .sub-text { display: inline-block; margin: 0; max-width: 820px; padding: 14px 38px 18px; border-radius: 40px; background: rgba(20,48,42,0.72); box-shadow: 0 8px 26px rgba(10,31,28,0.18); text-align: center; text-wrap: balance; font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 400; font-size: 50px; line-height: 1.18; letter-spacing: -0.005em; color: #F5EFE4; }

  /* ---- firma: tarjeta final (logo apilado; el símbolo lo dibuja el canvas) ---- */
  #card .wrap { position: absolute; left: 60px; right: 60px; top: 986px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .brand { display: flex; flex-direction: column; align-items: center; font-family: FrauncesLogo, Fraunces, Georgia, serif; font-style: normal; font-weight: 360; font-size: 104px; line-height: 1.02; letter-spacing: -0.04em; color: #F5EFE4; }
  .brand .rv { display: block; }
  .url { display: flex; flex-direction: column; align-items: center; gap: 14px; font-family: Inter, sans-serif; font-weight: 700; font-size: 36px; letter-spacing: 0.08em; color: #E8E1D3; }
  .url i { display: block; width: 72px; height: 3px; background: #D2725A; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-no-timeline data-start="0" data-width="1080" data-height="1920" data-duration="{{DUR}}">
  <canvas id="cv" class="clip" data-layout-allow-overflow data-start="0" data-duration="{{DUR}}" width="1080" height="1920"></canvas>

  <div id="title" class="clip layer" data-start="0" data-duration="{{TITLE_DUR}}">
    {{PLATE}}<div class="wrap">
      <div class="eyebrow rv" data-in="0.35" data-out="0" style="opacity:0"><i></i>{{EYEBROW}}</div>
      <h1>{{TITLE_WORDS}}</h1>
    </div>
  </div>

  <div id="annots" class="clip layer" data-layout-allow-overflow data-start="0" data-duration="{{DUR}}"></div>

  <div id="card" class="clip layer" data-start="{{CARD_START}}" data-duration="{{CARD_DUR}}">
    <div class="wrap">
      <div class="brand"><span id="card-l1" class="rv" style="opacity:0">Vida en</span><span id="card-l2" class="rv" style="opacity:0">el Jardín</span></div>
      <div id="card-url" class="url rv" style="opacity:0">vidaeneljardin.com<i></i></div>
    </div>
  </div>

  <div id="subs" class="clip layer" data-start="0" data-duration="{{DUR}}">
    <div class="sub-band" style="opacity:0"><p class="sub-text"></p></div>
  </div>
</div>
<script>window.REEL = {{REEL}};</script>
<script>
{{RUNTIME}}
</script>
<script>
{{SCENE}}
</script>
<script>VEJ.boot();</script>
</body>
</html>
